
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Öykü’nün Eriyip Bittiği Fetiş Listesi 💗</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;
 background:linear-gradient(145deg,#160914,#310d25,#100b16);
 color:white;font-family:Arial,sans-serif;
 text-align:center;padding:25px 15px;
}
h1{color:#ff8bc9;font-size:29px}
.subtitle{color:#e8b8d4}
.counter{margin:22px;color:#ff9dcc}
.players{display:flex;gap:14px;max-width:700px;margin:auto}
.player{
 flex:1;background:#35172f;border:2px solid #a43e78;
 border-radius:18px;padding:10px;cursor:pointer;
 transition:.2s;
}
.player:active{transform:scale(.96)}
.player img{width:100%;height:230px;object-fit:cover;border-radius:12px}
.player h2{font-size:19px}
.vs{font-size:25px;color:#ff8bc9;margin:18px}
button{
 background:#ed5ba7;color:white;border:0;
 border-radius:12px;padding:14px 25px;
 font-size:16px;font-weight:bold;margin:10px;cursor:pointer
}
#result{font-size:24px;color:#ff9dcc;margin:25px}
@media(max-width:450px){
 .player img{height:190px}
 h1{font-size:24px}
}
</style>
</head>
<body>
<h1>💗 Öykü’nün Eriyip Bittiği<br>Fetiş Listesi 💗</h1>
<p class="subtitle">Kalbinin sesini dinle... 👀</p>

<div class="counter" id="counter">Seçimini yap!</div>
<div class="players" id="players"></div>
<div class="vs">— VS —</div>
<div id="result"></div>
<button onclick="restart()">Yeniden Başlat ↻</button>

<script>
const people = [
 {name:"İsim 1", image:"https://placehold.co/400x500/35172f/ffffff?text=Foto+1"},
 {name:"İsim 2", image:"https://placehold.co/400x500/35172f/ffffff?text=Foto+2"},
 {name:"İsim 3", image:"https://placehold.co/400x500/35172f/ffffff?text=Foto+3"},
 {name:"İsim 4", image:"https://placehold.co/400x500/35172f/ffffff?text=Foto+4"}
];

let remaining=[];
let round=0;
let current=[];

function restart(){
 remaining=[...people];
 round=0;
 document.getElementById("result").innerHTML="";
 nextRound();
}

function nextRound(){
 if(remaining.length===1){
  document.getElementById("players").innerHTML="";
  document.getElementById("counter").innerText="🏆 ŞAMPİYON";
  document.getElementById("result").innerHTML=
   "💗 "+remaining[0].name+" 💗";
  return;
 }
 current=remaining.splice(0,2);
 round++;
 document.getElementById("counter").innerText=
 "Tur "+round+" • Seçimini yap";
 showPlayers();
}

function showPlayers(){
 const area=document.getElementById("players");
 area.innerHTML="";
 current.forEach((person,index)=>{
  const card=document.createElement("div");
  card.className="player";
  const img=document.createElement("img");
  img.src=person.image;
  img.alt=person.name;
  const name=document.createElement("h2");
  name.innerText=person.name;
  card.append(img,name);
  card.onclick=()=>choose(index);
  area.appendChild(card);
 });
}

function choose(index){
 const winner=current[index];
 remaining.push(winner);
 nextRound();
}

restart();
</script>
</body>
</html>
