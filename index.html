
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#170b17">
<title>Öykü'nün Eriyip Bittiği Fetiş Listesi 💗</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 min-height:100vh;
 padding:25px 15px;
 background:linear-gradient(145deg,#100711,#351027,#160b19);
 color:white;
 font-family:Arial,sans-serif;
 text-align:center;
}

h1{
 color:#ff8bc9;
 font-size:27px;
 line-height:1.35;
 margin-top:25px;
}

.subtitle{color:#e8b8d4;font-size:14px}

/* AÇILIŞ EKRANI */

#home{
 max-width:600px;
 margin:55px auto;
 padding:30px 20px;
 background:linear-gradient(145deg,#35172f,#1c1020);
 border:1px solid #a43e78;
 border-radius:25px;
 box-shadow:0 0 35px #e94c9c30;
}

.heart{
 font-size:65px;
 animation:heartbeat 1.5s infinite;
}

.home-title{
 color:#ff8bc9;
 font-size:29px;
 line-height:1.4;
}

.home-text{
 color:#e8b8d4;
 line-height:1.7;
}

.start-button{
 display:block;
 width:90%;
 max-width:300px;
 padding:17px;
 border:0;
 border-radius:15px;
 background:linear-gradient(90deg,#e94c9c,#ff8bc9);
 color:white;
 font-size:18px;
 font-weight:bold;
 margin:25px auto;
 cursor:pointer;
}

/* OYUN EKRANI */

#game{display:none}

.counter{
 margin:25px 0 12px;
 color:#ff9dcc;
 font-weight:bold;
 font-size:17px;
}

.progress{
 width:90%;
 max-width:400px;
 height:7px;
 background:#47243d;
 border-radius:20px;
 margin:15px auto 25px;
 overflow:hidden;
}

#bar{
 height:100%;
 width:0;
 background:#ff8bc9;
 transition:width .5s;
}

.players{
 display:flex;
 gap:12px;
 max-width:750px;
 margin:auto;
}

.player{
 flex:1;
 min-width:0;
 background:#35172f;
 border:2px solid #a43e78;
 border-radius:18px;
 padding:9px;
 cursor:pointer;
 transition:transform .3s,opacity .3s,box-shadow .3s;
 animation:cardEnter .45s ease;
}

.player img{
 width:100%;
 height:260px;
 object-fit:cover;
 border-radius:12px;
 background:#211321;
}

.player h2{
 font-size:16px;
 overflow-wrap:anywhere;
}

.player.winner{
 border-color:#ff8bc9;
 box-shadow:0 0 25px #ff55b5;
 transform:scale(1.04);
}

.player.loser{
 opacity:.25;
 transform:scale(.94);
}

.vs{
 color:#ff8bc9;
 font-size:34px;
 font-weight:900;
 margin:22px;
 animation:vsPulse 1.5s infinite;
}

button{
 background:#ed5ba7;
 color:white;
 border:0;
 border-radius:12px;
 padding:14px 25px;
 font-size:16px;
 font-weight:bold;
 margin:15px;
 cursor:pointer;
}

#result{
 color:#ff9dcc;
 font-size:25px;
 margin:25px 0;
 line-height:1.6;
}

.champion{
 animation:champion 1s ease infinite alternate;
}

.footer{
 color:#a98ba0;
 font-size:12px;
 margin-top:35px;
}

@keyframes heartbeat{
 0%,100%{transform:scale(1)}
 50%{transform:scale(1.13)}
}

@keyframes vsPulse{
 0%,100%{transform:scale(1);text-shadow:0 0 5px #ff8bc9}
 50%{transform:scale(1.15);text-shadow:0 0 22px #ff8bc9}
}

@keyframes cardEnter{
 from{opacity:0;transform:translateY(18px)}
 to{opacity:1;transform:translateY(0)}
}

@keyframes champion{
 from{transform:scale(1)}
 to{transform:scale(1.08)}
}

@media(max-width:450px){
 .player img{height:190px}
 h1{font-size:23px}
 .player{padding:6px}
 .player h2{font-size:14px}
 .home-title{font-size:25px}
 .vs{font-size:30px}
}
</style>
</head>

<body>

<!-- AÇILIŞ -->

<div id="home">
 <div class="heart">💗</div>

 <div class="home-title">
  Öykü'nün Eriyip Bittiği<br>
  Fetiş Listesi
 </div>

 <p class="home-text">
  Hazır mısın Öyküşüm? 👀<br>
  Birbirinden zor seçimler seni bekliyor.
  Bakalım sonunda kim kazanacak?
 </p>

 <button type="button" class="start-button" onclick="startGame()">
  💗 OYUNA BAŞLA 💗
 </button>

 <p class="subtitle">8 aday • 1 büyük şampiyon</p>
</div>

<!-- OYUN -->

<div id="game">

 <h1>
  💗 Öykü'nün Eriyip Bittiği<br>
  Fetiş Listesi 💗
 </h1>

 <p class="subtitle">
  En çok yükseldiğin kim? 👀
 </p>

 <div class="counter" id="counter">
  SEÇİMİNİ YAP!
 </div>

 <div class="progress">
  <div id="bar"></div>
 </div>

 <div class="players" id="players"></div>

 <div class="vs" id="vs">— VS —</div>

 <div id="result"></div>

 <button type="button" onclick="restart()">
  ↻ Yeniden Başlat
 </button>

</div>

<div class="footer">Made by Doruk for Sapık Öyküş</div>

<script>

const people = [
 {name:"Dušan Vlahović",image:"dusan.JPG"},
 {name:"Alex Nübel",image:"nubel.JPG"},
 {name:"Samuel Eto'o",image:"eto.JPG"},
 {name:"David Beckham",image:"beckham.JPG"},
 {name:"Patrick Jane",image:"patrick.JPG"},
 {name:"Dexter Morgan",image:"dexter.JPG"},
 {name:"Matheo Arntzen",image:"matheo.JPG"},
 {name:"Lukas Bergvall",image:"bergvall.JPG"}
];

let remaining = [];
let current = [];
let selectedCount = 0;
let locked = false;

function startGame(){
 document.getElementById("home").style.display = "none";
 document.getElementById("game").style.display = "block";
 restart();
}

function restart(){

 locked = false;
 remaining = [...people];
 current = [];
 selectedCount = 0;

 document.getElementById("result").innerHTML = "";
 document.getElementById("vs").style.display = "block";
 document.getElementById("bar").style.width = "0%";

 nextRound();
}

function nextRound(){

 if(remaining.length === 1){

  document.getElementById("players").innerHTML = "";
  document.getElementById("vs").style.display = "none";

  document.getElementById("counter").innerText =
   "🏆 BÜYÜK ŞAMPİYON 🏆";

  document.getElementById("bar").style.width = "100%";

  document.getElementById("result").innerHTML =
   "<div class='champion'>👑 " +
   remaining[0].name +
   " 👑</div><br>💗 Öykü'nün aşkı belli oldu!";

  return;
 }

 current = remaining.splice(0,2);

 document.getElementById("counter").innerText =
  "SEÇİM " + (selectedCount + 1) +
  " • KİMİ SEÇİYORSUN?";

 document.getElementById("bar").style.width =
  (selectedCount / 7 * 100) + "%";

 showPlayers();
}

function showPlayers(){

 const area = document.getElementById("players");
 area.innerHTML = "";

 current.forEach((person,index)=>{

  const card = document.createElement("div");
  card.className = "player";

  const img = document.createElement("img");
  img.src = person.image;
  img.alt = person.name;

  img.onerror = function(){
   this.onerror = null;
   this.src =
    "https://placehold.co/400x500/35172f/ffffff?text=Foto+Yok";
  };

  const name = document.createElement("h2");
  name.innerText = person.name;

  card.appendChild(img);
  card.appendChild(name);

  card.onclick = function(){
   choose(index);
  };

  area.appendChild(card);

 });
}

function choose(index){

 if(locked) return;

 locked = true;

 const cards = document.querySelectorAll(".player");
 const winner = current[index];

 cards[index].classList.add("winner");
 cards[1-index].classList.add("loser");

 selectedCount++;

 setTimeout(function(){

  remaining.push(winner);
  locked = false;
  nextRound();

 },650);
}

</script>

</body>
</html>
