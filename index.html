
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Öykü'nün Eriyip Bittiği Fetiş Listesi 💗</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;
 background:linear-gradient(145deg,#100711,#351027,#160b19);
 color:white;font-family:Arial,sans-serif;
 text-align:center;padding:25px 15px;
}
h1{color:#ff8bc9;font-size:27px;line-height:1.3}
.subtitle{color:#e8b8d4}
.counter{margin:22px;color:#ff9dcc;font-weight:bold}
.players{
 display:flex;gap:14px;max-width:750px;margin:auto;
}
.player{
 flex:1;min-width:0;background:#35172f;
 border:2px solid #a43e78;border-radius:18px;
 padding:10px;cursor:pointer;transition:.2s;
}
.player:hover{transform:translateY(-5px);border-color:#ff8bc9}
.player img{
 width:100%;height:260px;object-fit:cover;
 border-radius:12px;background:#211321;
}
.player h2{font-size:17px;overflow-wrap:anywhere}
.vs{font-size:27px;color:#ff8bc9;margin:20px}
button{
 background:#ed5ba7;color:white;border:0;
 border-radius:12px;padding:14px 25px;
 font-size:16px;font-weight:bold;margin:12px;cursor:pointer;
}
#result{font-size:25px;color:#ff9dcc;margin:25px}
.progress{
 width:90%;max-width:400px;height:7px;
 background:#47243d;border-radius:20px;margin:15px auto;
 overflow:hidden;
}
#bar{height:100%;width:0;background:#ff8bc9;transition:.3s}
@media(max-width:450px){
 .player img{height:190px}
 h1{font-size:23px}
 .player{padding:7px}
}
</style>
</head>
<body>

<h1>💗 Öykü'nün Eriyip Bittiği<br>Fetiş Listesi 💗</h1>
<p class="subtitle">Kalbinin sesini dinle... 👀</p>

<div class="counter" id="counter">Seçimini yap!</div>
<div class="progress"><div id="bar"></div></div>

<div class="players" id="players"></div>
<div class="vs" id="vs">— VS —</div>

<div id="result"></div>
<button onclick="restart()">↻ Yeniden Başlat</button>

<script>
const people = [
 {name:"Dušan Vlahović", image:"dusan.jpg"},
 {name:"Alex Nübel", image:"nubel.jpg"},
 {name:"Samuel Eto'o", image:"eto.jpg"},
 {name:"David Beckham", image:"beckham.jpg"},
 {name:"Patrick Jane", image:"patrick.jpg"},
 {name:"Dexter Morgan", image:"dexter.jpg"},
 {name:"Matheo Arntzen", image:"matheo.jpg"},
 {name:"Lukas Bergvall", image:"bergvall.jpg"}
];

let remaining=[];
let current=[];
let round=0;
let selectedCount=0;

function restart(){
 remaining=[...people];
 current=[];
 round=0;
 selectedCount=0;
 document.getElementById("result").innerHTML="";
 document.getElementById("vs").style.display="block";
 document.getElementById("bar").style.width="0%";
 nextRound();
}

function nextRound(){
 if(remaining.length===1){
  document.getElementById("players").innerHTML="";
  document.getElementById("vs").style.display="none";
  document.getElementById("counter").innerText="🏆 BÜYÜK ŞAMPİYON";
  document.getElementById("bar").style.width="100%";
  document.getElementById("result").innerHTML=
   "👑 "+remaining[0].name+" 👑<br><br>💗 Öykü'nün favorisi belli oldu!";
  return;
 }

 round++;
 current=remaining.splice(0,2);
 document.getElementById("counter").innerText=
 "TUR "+round+" • Kimi seçiyorsun?";
 document.getElementById("bar").style.width=
 (selectedCount/7*100)+"%";
 showPlayers();
}

function showPlayers(){
 const area=document.getElementById("players");
 area.innerHTML="";

 current.forEach((person,index)=>{
  const card=document.createElement("div");
  card.className="player";

  const img=document.createElement("img");
  img.src=person.image;
  img.alt=person.name;
  img.onerror=()=>{
   img.src="https://placehold.co/400x500/35172f/ffffff?text=Foto+Yukle";
  };

  const name=document.createElement("h2");
  name.innerText=person.name;

  card.append(img,name);
  card.onclick=()=>choose(index);
  area.appendChild(card);
 });
}

function choose(index){
 const winner=current[index];
 remaining.push(winner);
 selectedCount++;
 nextRound();
}

restart();
</script>
</body>
</html>
